title: Subagent execution lineage inspection

scenario:
  id: subagent-lineage-inspection
  surface: gateway
  coverage:
    secondary:
      - gateway.identity-and-presence-apis
  objective: Verify a real mock-provider sessions_spawn turn records bounded parent-child execution lineage that survives Gateway restart and remains inspectable through the audit CLI.
  successCriteria:
    - A deterministic mock-provider turn invokes the real sessions_spawn tool through an ephemeral Gateway.
    - The child identity context links to the exact parent context, execution, run, and agent principal with depth one.
    - Existing V1 lineage, grant, assurance, coverage, and missing-evidence fields describe the spawn without exposing prompt, task, session, or raw principal references.
    - Audit CLI text and JSON select the exact parent and child before and after Gateway restart.
    - Persisted child context bytes remain stable across restart.
  docsRefs:
    - docs/gateway/audit.md
    - docs/tools/subagents.md
    - docs/cli/audit.md
  codeRefs:
    - src/agents/tools/sessions-spawn-tool.ts
    - src/agents/subagents/spawn/subagent-spawn.ts
    - src/agents/subagents/spawn/subagent-spawn-gateway.ts
    - src/gateway/agent-turn/agent-run-execution-lineage.ts
    - src/audit/execution-identity-context-build.ts
    - src/commands/audit.ts
    - test/e2e/qa-lab/runtime/subagent-lineage-inspection.ts
  execution:
    kind: script
    parallelSafe: true
    path: test/e2e/qa-lab/runtime/subagent-lineage-inspection.ts
    config:
      requiredProviderMode: mock-openai
    args:
      - --output-dir
      - ${outputDir}
    timeoutMs: 180000
    summary: Runs a real sessions_spawn turn through an ephemeral mock-provider Gateway, inspects parent and child identity, restarts the Gateway, and verifies stable CLI and persisted evidence.
